<!DOCTYPE html>

<style>
:root{
  --bg:#fff8f0; --card:#ffffff; --ink:#2b2118; --muted:#8a7a6c; --line:#eee2d4;
  --red:#e63946; --red2:#c1121f; --gold:#f4a261; --green:#2a9d8f; --green-bg:#e3f5f2; --bad-bg:#fde8e8;
  --t1:#e63946; --t2:#f4a261; --t3:#2a9d8f; --t4:#457b9d;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","PingFang SC","Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);min-height:100vh}
#app{max-width:520px;margin:0 auto;padding:14px 16px 40px;min-height:100vh;display:flex;flex-direction:column}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.hz{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif}
h1{font-size:26px;margin:6px 0 2px}
h2{font-size:20px;margin:18px 0 8px}
.muted{color:var(--muted)}
.small{font-size:13px}
.center{text-align:center}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spacer{flex:1}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 2px 0 var(--line),0 6px 18px rgba(80,50,20,.06);margin:10px 0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:16px;font-weight:700;font-size:18px;background:var(--card);box-shadow:0 3px 0 var(--line);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn.primary{background:var(--red);color:#fff;box-shadow:0 4px 0 var(--red2)}
.btn.primary:active{box-shadow:0 1px 0 var(--red2)}
.btn.green{background:var(--green);color:#fff;box-shadow:0 4px 0 #1f776d}
.btn.ghost{background:transparent;box-shadow:none;color:var(--muted);font-weight:600;font-size:16px}
.btn.sm{padding:10px 14px;font-size:15px;width:auto;border-radius:12px}
.btn[disabled]{opacity:.45}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--card);border-radius:999px;padding:7px 12px;font-weight:700;font-size:15px;box-shadow:0 2px 0 var(--line)}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.ring-wrap{display:flex;align-items:center;gap:16px}
.ring-wrap svg{flex:none}
.unitcard{display:flex;gap:14px;align-items:center}
.unitcard .uemoji{font-size:38px;width:58px;height:58px;display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:16px}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .3s}
.week{display:flex;justify-content:space-between;margin-top:6px}
.week div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.week span{width:30px;height:30px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:15px}
.week span.ok{background:var(--gold)}
.week span.today{outline:2px solid var(--red);outline-offset:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px}
.switch{width:52px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
.switch.on{background:var(--green)}.switch.on::after{left:25px}

/* session */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.topbar .bar{flex:1;height:14px}
.x{font-size:24px;color:var(--muted);padding:4px 6px}
.combo{font-weight:800;color:var(--red);min-width:52px;text-align:right}
.prompt{font-size:20px;font-weight:700;margin:12px 0 6px}
.bigemoji{font-size:84px;line-height:1.1;text-align:center;margin:10px 0}
.bighz{font-size:48px;text-align:center;font-weight:600;letter-spacing:2px}
.bigpy{font-size:22px;text-align:center;color:var(--red);font-weight:600;margin-top:4px}
.nl{font-size:18px;text-align:center;margin-top:10px}
.hidden{display:none!important}
.speaker{width:96px;height:96px;border-radius:50%;background:var(--red);color:#fff;font-size:42px;display:flex;align-items:center;justify-content:center;margin:12px auto;box-shadow:0 5px 0 var(--red2)}
.speaker:active{transform:translateY(3px);box-shadow:0 2px 0 var(--red2)}
.speaker.sm{width:60px;height:60px;font-size:26px;margin:0;box-shadow:0 3px 0 var(--red2)}
.speaker.slow{background:var(--gold);box-shadow:0 3px 0 #c97b3c}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.opt{background:var(--card);border-radius:18px;box-shadow:0 3px 0 var(--line);padding:16px 8px;min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:3px solid transparent}
.opt .e{font-size:46px}
.opt .l{font-size:13px;color:var(--muted)}
.opt.text{min-height:70px;font-size:22px;font-weight:700}
.opt.ok{border-color:var(--green);background:var(--green-bg)}
.opt.bad{border-color:var(--red);background:var(--bad-bg)}
.opt[disabled]{pointer-events:none}
.feedback{border-radius:16px;padding:14px;margin-top:14px;font-weight:600}
.feedback.ok{background:var(--green-bg);color:#1d6b62}
.feedback.bad{background:var(--bad-bg);color:var(--red2)}
.footer{margin-top:auto;padding-top:16px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:70px;padding:10px;border-radius:16px}
.tiles.answer{background:var(--card);border:2px dashed var(--line);margin:12px 0;min-height:86px;align-content:flex-start}
.tile{background:var(--card);border-radius:12px;padding:8px 12px;box-shadow:0 3px 0 var(--line);text-align:center}
.tile b{display:block;font-size:22px}
.tile small{color:var(--red);font-size:13px}
.tile.used{opacity:.2;pointer-events:none}
.canvas-wrap{background:var(--card);border-radius:16px;padding:8px;margin-top:10px}
canvas{width:100%;height:170px;display:block}
.score{font-size:40px;font-weight:800;text-align:center}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin-right:4px}
.rec{width:110px;height:110px;border-radius:50%;background:var(--green);color:#fff;font-size:46px;display:flex;align-items:center;justify-content:center;margin:14px auto 6px;box-shadow:0 5px 0 #1f776d}
.rec.on{background:var(--red);box-shadow:0 0 0 0 rgba(230,57,70,.6);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(230,57,70,.5)}70%{box-shadow:0 0 0 22px rgba(230,57,70,0)}100%{box-shadow:0 0 0 0 rgba(230,57,70,0)}}
.level{height:8px;border-radius:99px;background:var(--line);overflow:hidden;max-width:220px;margin:6px auto}
.level i{display:block;height:100%;width:0;background:var(--green);transition:width .05s}
.bubble{max-width:85%;padding:10px 14px;border-radius:18px;margin:8px 0;background:var(--card);box-shadow:0 2px 0 var(--line)}
.bubble.A{border-bottom-left-radius:4px}
.bubble.B{margin-left:auto;background:#fff1e6;border-bottom-right-radius:4px}
.bubble.playing{outline:3px solid var(--gold)}
.bubble .h{font-size:22px}
.bubble .p{color:var(--red);font-size:14px}
.bubble .n{color:var(--muted);font-size:14px;margin-top:3px}
.who{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.5px}
.banner{background:linear-gradient(135deg,#ffe8d6,#fff1e6);border-radius:16px;padding:14px;margin:8px 0;font-weight:600}
.celebrate{text-align:center;padding-top:30px}
.celebrate .huge{font-size:96px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%) translateY(-120%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;z-index:50;transition:transform .35s;max-width:90%;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.confetti{position:fixed;top:-20px;font-size:22px;z-index:40;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.8}}
.list-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border:0}
.list-item .e{font-size:28px;width:40px;text-align:center}
.list-item .t{flex:1}
.list-item .t b{font-size:20px}
.list-item .t div{font-size:13px}
.unitrow{display:flex;align-items:center;gap:12px}
.unitrow .ue{font-size:30px}
.lock{opacity:.45}
input[type=number],select,textarea{font:inherit;font-size:17px;padding:12px;border-radius:12px;border:2px solid var(--line);background:#fff;width:100%;-webkit-user-select:text;user-select:text}
textarea{min-height:90px;font-size:12px}
label{font-weight:700;display:block;margin:14px 0 6px}
input[type=range]{width:100%}
.stage-badge{font-size:15px;font-weight:700;color:var(--red2)}
.tonekey{display:flex;gap:6px;justify-content:center;font-size:12px;color:var(--muted);margin-top:8px}
.tonekey b{font-weight:800}
.tw{margin-top:12px;background:#eef6ff;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.5;cursor:pointer}
.note p{font-size:16px}
.exline{background:var(--bg);border-radius:12px;padding:10px 12px;margin-top:8px;cursor:pointer}
.bubble.story{max-width:100%;text-align:left}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.match>div{display:flex;flex-direction:column;gap:10px}
.mt{background:var(--card);border-radius:14px;box-shadow:0 3px 0 var(--line);padding:10px 8px;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:3px solid transparent;font-size:15px;font-weight:600}
.mt .hz{font-size:22px}.mt small{color:var(--red);font-size:12px}
.mt.sel{border-color:var(--gold)}.mt.done{opacity:.25}.mt.wrong{border-color:var(--red);background:var(--bad-bg)}
.gap{display:inline-block;min-width:44px;border-bottom:3px solid var(--red);text-align:center;color:var(--red)}
.opt.text small{display:block}
</style>

<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<script src="data.js"></script>
<script src="data2.js"></script>
<script>
"use strict";
/* =========================================================
   学中文 – een Chinees-app die leert zoals een kind leert
   ========================================================= */
const KEY = "xuezhongwen_v1";
const app = document.getElementById("app");

/* ---------- datum ---------- */
function dayKey(d = new Date()) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function dayNum(key) { const [y, m, d] = key.split("-").map(Number); return Math.round(Date.UTC(y, m - 1, d) / 864e5); }
function keyFromNum(n) { return new Date(n * 864e5).toISOString().slice(0, 10); }
const today = () => dayKey();
const todayNum = () => dayNum(today());

/* ---------- opslag ---------- */
const DEFAULT = {
  v: 1, onboarded: false, age: null, goal: 30, rate: 0.85, voiceURI: null,
  xp: 0, items: {}, units: {}, days: {},
  streak: { count: 0, best: 0, last: null, freezes: 0 },
  bestCombo: 0, totalSpeak: 0
};
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const d = JSON.parse(raw); const s = Object.assign(clone(DEFAULT), d); s.streak = Object.assign(clone(DEFAULT.streak), d.streak || {}); return s; }
  } catch (e) {}
  return clone(DEFAULT);
}
let S = load();
const DATA_V = 2;
if (S.dataV !== DATA_V) { S.items = {}; S.units = {}; S.dataV = DATA_V; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
function dayData(k = today()) { if (!S.days[k]) S.days[k] = { secs: 0, xp: 0, goalMet: false }; return S.days[k]; }

/* ---------- pinyin ---------- */
const TM = { a: "āáǎà", e: "ēéěè", i: "īíǐì", o: "ōóǒò", u: "ūúǔù", "ü": "ǖǘǚǜ", A: "ĀÁǍÀ", E: "ĒÉĚÈ", I: "ĪÍǏÌ", O: "ŌÓǑÒ", U: "ŪÚǓÙ", "Ü": "ǕǗǙǛ" };
function markSyl(s) {
  const m = /^([A-Za-züÜvV]+?)([1-5])$/.exec(s);
  if (!m) return s;
  let b = m[1].replace(/v/g, "ü").replace(/V/g, "Ü");
  const t = +m[2];
  if (t === 5) return b;
  let idx = b.search(/[aA]/);
  if (idx < 0) idx = b.search(/[eE]/);
  if (idx < 0) { const ou = b.search(/[oO][uU]/); if (ou >= 0) idx = ou; }
  if (idx < 0) { for (let i = b.length - 1; i >= 0; i--) { if ("aeiouüAEIOUÜ".includes(b[i])) { idx = i; break; } } }
  if (idx < 0) return b;
  const set = TM[b[idx]];
  return set ? b.slice(0, idx) + set[t - 1] + b.slice(idx + 1) : b;
}
function joinWord(syls) {
  return syls.map((s, i) => { const m = markSyl(s); return (i > 0 && /^[aeoAEOāáǎàēéěèōóǒò]/.test(m)) ? "'" + m : m; }).join("");
}
const toneOf = s => +(s.match(/[1-5]$/) || [0, 5])[0] || 5;
function stripTone(s) { return s.replace(/[1-5]$/, ""); }

/* ---------- getallen (voor je leeftijd) ---------- */
const DZ = ["零", "一", "二", "三", "四", "五", "六", "七", "八", "九"];
const DP = ["ling2", "yi1", "er4", "san1", "si4", "wu3", "liu4", "qi1", "ba1", "jiu3"];
function numZh(n) {
  n = Math.max(1, Math.min(99, Math.round(n || 20)));
  if (n < 10) return { zh: DZ[n], py: DP[n] };
  if (n === 10) return { zh: "十", py: "shi2" };
  if (n < 20) return { zh: "十" + DZ[n - 10], py: "shi2 " + DP[n - 10] };
  const t = Math.floor(n / 10), o = n % 10;
  return { zh: DZ[t] + "十" + (o ? DZ[o] : ""), py: DP[t] + " shi2" + (o ? " " + DP[o] : "") };
}

/* ---------- lesstof voorbereiden ---------- */
const ITEM_UNIT = {};
UNITS.forEach((u, ui) => u.items.forEach(it => { ITEM_UNIT[it.id] = ui; }));
function rawItem(id) { const ui = ITEM_UNIT[id]; return ui == null ? null : UNITS[ui].items.find(i => i.id === id); }
function derive(raw) {
  let it = Object.assign({}, raw);
  if (raw.personal === "age") {
    const n = numZh(S.age);
    it.zh = "我|" + n.zh + "|岁"; it.py = "wo3|" + n.py + "|sui4"; it.nl = "Ik ben " + (S.age || 20) + " jaar";
  }
  const zp = it.zh.split("|"), pp = it.py.split("|");
  it.parts = zp.map((z, i) => ({ zh: z, n: (pp[i] || "").trim(), py: joinWord((pp[i] || "").trim().split(/\s+/)) }));
  it.zhFull = zp.join("");
  it.pyText = it.parts.map(p => p.py).join(" ");
  it.syls = it.py.replace(/\|/g, " ").trim().split(/\s+/);
  it.isPhrase = zp.length >= 2;
  it.unit = ITEM_UNIT[raw.id];
  return it;
}
function item(id) { const r = rawItem(id); return r ? derive(r) : null; }
function lineOf(l) {
  if (l.personal) {
    const n = numZh(S.age);
    const nine = l.personal === "age_nine";
    return { s: l.s, zh: "我" + n.zh + "岁。" + (nine ? "你呢？" : ""), py: "wo3 " + n.py + " sui4" + (nine ? " ni3 ne5" : ""), nl: "Ik ben " + (S.age || 20) + " jaar." + (nine ? " En jij?" : "") };
  }
  return l;
}
// woorden van meerdere lettergrepen (uit de lesstof), zodat pinyin in gesprekken als "Mǎkèsī" komt i.p.v. "Mǎ kè sī"
const LEX = (() => {
  const m = new Set();
  UNITS.forEach(u => u.items.forEach(r => { if (!r.py) return; r.py.split("|").forEach(w => { const s = w.trim().split(/\s+/); if (s.length > 1 && !s.some(x => /^de5$/i.test(x))) m.add(s.join(" ").toLowerCase()); }); }));
  return m;
})();
const NOJOIN = new Set(["duo1 da4", "kan4 shu1"]);
function lineDerived(l) {
  l = lineOf(l);
  if (l.py.includes("|")) { // nieuwe lesstof: woorden al gegroepeerd
    const syls = l.py.replace(/\|/g, " ").trim().split(/\s+/);
    const words = l.py.split("|").map(w => joinWord(w.trim().split(/\s+/)));
    return { s: l.s, zhFull: l.zh, pyText: words.join(" "), syls, nl: l.nl, e: l.e };
  }
  const syls = l.py.trim().split(/\s+/), words = [];
  for (let i = 0; i < syls.length;) {
    let len = Math.min(5, syls.length - i);
    const age = numZh(S.age).py;
    for (; len > 1; len--) { const k = syls.slice(i, i + len).join(" ").toLowerCase(); if ((LEX.has(k) && !NOJOIN.has(k)) || k === age) break; }
    words.push(len > 1 ? joinWord(syls.slice(i, i + len)) : markSyl(syls[i]));
    i += len;
  }
  return { s: l.s, zhFull: l.zh, pyText: words.join(" "), syls, nl: l.nl };
}
function allItemIds() { return UNITS.flatMap(u => u.items.map(i => i.id)); }

/* ---------- spraak (tekst → stem) ---------- */
let zhVoice = null;
function voicesZh() { try { return speechSynthesis.getVoices().filter(v => /^zh[-_](CN|Hans)/i.test(v.lang) || v.lang === "zh"); } catch (e) { return []; } }
function pickVoice() {
  const vs = voicesZh();
  if (!vs.length) { zhVoice = null; return; }
  zhVoice = vs.find(v => v.voiceURI === S.voiceURI) || vs.find(v => /premium|enhanced|verbeterd|plus/i.test(v.name)) || vs.find(v => /tingting|ting-ting|lili|yu-shu|li-mu/i.test(v.name)) || vs[0];
}
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
let speakToken = 0;
function say(text, opts = {}) {
  return new Promise(res => {
    if (!("speechSynthesis" in window)) return res();
    const tok = ++speakToken;
    try { speechSynthesis.cancel(); } catch (e) {}
    const u = new SpeechSynthesisUtterance(text.replace(/[|]/g, ""));
    u.lang = "zh-CN";
    if (zhVoice) u.voice = zhVoice;
    u.rate = Math.max(0.3, Math.min(1.5, (S.rate || 0.85) * (opts.slow ? 0.6 : 1)));
    u.pitch = opts.pitch || 1;
    let done = false;
    const fin = () => { if (!done) { done = true; touch(); res(); } };
    u.onend = fin; u.onerror = fin;
    setTimeout(fin, 1200 + text.length * 650 / u.rate);
    // iOS: kleine vertraging na cancel() voorkomt dat de uitspraak wegvalt
    setTimeout(() => { if (tok === speakToken) try { speechSynthesis.speak(u); } catch (e) { fin(); } }, 60);
  });
}
function stopSay() { speakToken++; try { speechSynthesis.cancel(); } catch (e) {} }

/* ---------- geluidjes ---------- */
let fxCtx = null;
function fx(kind) {
  try {
    fxCtx = fxCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (fxCtx.state === "suspended") fxCtx.resume();
    const seq = kind === "ok" ? [[660, 0], [880, .09]] : kind === "bad" ? [[220, 0], [180, .12]] : [[523, 0], [659, .1], [784, .2], [1046, .3]];
    seq.forEach(([f, t]) => {
      const o = fxCtx.createOscillator(), g = fxCtx.createGain();
      o.type = kind === "bad" ? "triangle" : "sine"; o.frequency.value = f;
      const s = fxCtx.currentTime + t;
      g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(0.18, s + .02); g.gain.exponentialRampToValueAtTime(0.0001, s + .18);
      o.connect(g).connect(fxCtx.destination); o.start(s); o.stop(s + .2);
    });

        frames.push({ t: now, f, r });
        onLevel && onLevel(Math.min(1, r / (thr * 8)));
        if (now > maxMs || (voicedSeen > 5 && now - lastVoice > 800)) return finish();
      }
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  });
}

let quiet = false; // "ik kan nu niet praten"
let sess = null;

// welke oefenvormen passen bij een woord of zin?
function zhnlOK(it) { return it.isPhrase && !/[\/()…]/.test(it.nl) && nlWords(it.nl).length <= 8; }
function nlWords(s) { return s.replace(/[?!.,"'’:;]/g, "").trim().split(/\s+/).filter(Boolean); }
function exForReview(it) {
  const s = S.items[it.id] || { box: 0 };
  const P = it.isPhrase, long = it.parts.length >= 3;
  let types;
  if (s.box <= 1) types = P ? ["translate", "listen", long ? "build" : "translate"] : ["listen", "read", "listen"];
  else if (s.box <= 3) types = P ? ["translate", long ? "build" : "translate", long ? "fill" : "listen", zhnlOK(it) ? "zhnl" : "translate", "speak"] : ["hanzi", "listen", "read", "hanzi"];
  else types = P ? [long ? "build" : "translate", zhnlOK(it) ? "zhnl" : "translate", long ? "fill" : "hanzi", "speak"] : ["hanzi", "hanzi", "listen", toneEligible(it) ? "tone" : "hanzi"];
  if (quiet) types = types.filter(t => t !== "speak");
  if (!types.length) types = ["listen"];
  return { type: pick(types), id: it.id };
}
// kies nieuwe woorden voor deze les: nooit twee woorden die op elkaar lijken in dezelfde les
function pickBatch(fresh, size) {
  const out = [];
  for (const r of fresh) {
    if (out.length >= size) break;
    const it = item(r.id);
    if (out.some(o => soundSim(o, it) >= SIMILAR)) continue; // die komt in een volgende les
    out.push(it);
  }
  if (!out.length && fresh.length) out.push(item(fresh[0].id));
  return out;
}
function lessonInfo(u) {
  const per = 4, total = Math.ceil(u.items.length / per) + (u.story ? 1 : 0) + (u.dialogue.length ? 1 : 0);
  const st = unitState(u), intro = u.items.filter(i => S.items[i.id] && S.items[i.id].intro).length;
  const done = Math.ceil(intro / per) + (st.story ? 1 : 0) + (st.dialogue ? 1 : 0);
  return { done: Math.min(done, total), total };
}
function buildLesson() {
  const q = [];
  const dueIds = shuffle(introducedIds().filter(id => S.items[id].due <= todayNum())
    .sort((a, b) => S.items[a].due - S.items[b].due || S.items[a].box - S.items[b].box).slice(0, 12)).slice(0, 5);
  const reviews = dueIds.map(id => exForReview(item(id)));
  const ui = currentUnitIndex();
  let newPart = [];
  if (ui < UNITS.length) {
    const u = UNITS[ui], st = unitState(u);
    const fresh = u.items.filter(i => !(S.items[i.id] && S.items[i.id].intro));
    const its = pickBatch(fresh, 4);
    if (fresh.length === u.items.length) {
      q.push({ type: "unitstart", unit: ui });
      (u.notes || []).forEach((n, k) => q.push({ type: "note", unit: ui, n: k }));
    }
    if (its.length) {
      const knownBefore = introducedIds().length;
      // 1) nieuw woord zien + meteen even checken
      its.forEach((it, k) => {
        newPart.push({ type: "intro", id: it.id });
        if (k > 0 || knownBefore >= 3) newPart.push({ type: "listen", id: it.id });
      });
      // 2) koppelen
      if (knownBefore + its.length >= 4) newPart.push({ type: "match", ids: its.map(i => i.id) });
      // 3) gebruiken: woorden lezen/luisteren, zinnen vertalen en bouwen
      const words = its.filter(i => !i.isPhrase), sents = its.filter(i => i.isPhrase);
      shuffle(words).forEach(it => newPart.push({ type: "read", id: it.id }));
      sents.forEach(it => {
        newPart.push({ type: "translate", id: it.id });
        if (it.parts.length >= 3) newPart.push({ type: pick(["build", "fill"]), id: it.id });
        else newPart.push({ type: zhnlOK(it) ? "zhnl" : "listen", id: it.id });
      });
      // 4) één keer echt spreken (een zin als het kan)
      if (!quiet) { const sp = sents.length ? pick(sents) : pick(its); newPart.push({ type: "speak", id: sp.id }); }
      // 5) nog één keer luisteren naar de nieuwe woorden
      shuffle(words).slice(0, 2).forEach(it => newPart.push({ type: "listen", id: it.id }));
    }
    const remaining = fresh.length - its.length;
    // herhaling na de introducties door de les heen strooien
    const intros = newPart.filter(e => e.type === "intro" || e.type === "listen").length;
    const head = newPart.slice(0, intros), tail = newPart.slice(intros);
    reviews.forEach(r => tail.splice(Math.floor(Math.random() * (tail.length + 1)), 0, r));
    q.push(...head, ...tail);
    if (remaining <= 0 && u.story && !st.story) q.push({ type: "story", unit: ui });
    if (remaining <= 0 && u.dialogue.length && !st.dialogue) q.push({ type: "dialogue", unit: ui });
    if (remaining <= 0 && checkUnitDone(u)) save();
  } else q.push(...reviews);
  // niets nieuws? dan een herhaalles
  if (q.length < 6) {
    const ids = shuffle(introducedIds()).slice(0, 10);
    ids.forEach(id => q.push(exForReview(item(id))));
    if (ids.length >= 4) q.splice(2, 0, { type: "match", ids: ids.slice(0, 4) });
  }
  return q;
}
// Toon-gym: niveau 1 = 1e vs 4e toon, niveau 2 = 2e vs 3e toon, niveau 3 = alle vier
const TONE_LEVELS = { 1: [1, 4], 2: [2, 3], 3: [1, 2, 3, 4] };
function buildToneGym(level = 1) {
  const q = [];
  for (let i = 0; i < 12; i++) q.push({ type: "drilltone", lvl: level });
  if (!quiet && level === 3) for (let i = 0; i < 3; i++) q.splice(3 + i * 4, 0, { type: "drillspeak" });
  return q;
}

function startSession(kind = "lesson", opt) {
  stopSay();
  const queue = kind === "tones" ? buildToneGym(opt || 1) : buildLesson();
  sess = { kind, queue, idx: 0, ok: 0, bad: 0, combo: 0, maxCombo: 0, xp: 0, requeued: new Set(), startUnits: unitsDone(), lvl: opt };
  timing = true; touch();

}
function comboMult() { return sess.combo >= 10 ? 2 : sess.combo >= 5 ? 1.5 : 1; }
function answered(ok, ex, opts = {}) {
  if (ok) {
    sess.ok++; sess.combo++; sess.maxCombo = Math.max(sess.maxCombo, sess.combo);
    S.bestCombo = Math.max(S.bestCombo, sess.combo);
    const gain = Math.round((opts.xp || 10) * comboMult()); sess.xp += gain; addXP(gain);
    if (sess.combo === 5 || sess.combo === 10 || sess.combo === 20) toast(`🔥 Combo ×${sess.combo}! ${comboMult()}× XP`);
    fx("ok");
  } else if (ok === false) {
    sess.bad++; sess.combo = 0; fx("bad");
    // fout? later in deze les nog een keer
    const k = ex.type + ":" + (ex.id || "");
    if (!sess.requeued.has(k) && !["speak", "storyq", "story", "dialogue"].includes(ex.type)) { sess.requeued.add(k); sess.queue.push(Object.assign({}, ex, { retry: true })); }
  }
  if (ex.id && ok !== null && ex.type !== "intro") srs(ex.id, ok);
  save();
  const c = document.getElementById("combo"); if (c) c.textContent = sess.combo >= 2 ? "🔥×" + sess.combo : "";
}

function tileExercise(ex, it, cfg) {
  const tiles = shuffle(cfg.tiles.map((t, i) => Object.assign({ i }, t)));
  let ans = [];
  shell(`<div class="prompt">${cfg.title}</div>${cfg.top}
    <div class="tiles answer" id="ans"></div>
    <div class="tiles" id="pool">${tiles.map((t, k) => tileHTML(t, k, "tile")).join("")}</div>`,
    { footer: `<button class="btn primary" data-act="check" disabled>Controleer</button>` });
  const key = t => t.zh || t.w.toLowerCase();
  const draw = () => {
    const a = document.getElementById("ans");
    a.innerHTML = ans.map((k, j) => tileHTML(tiles[k], j, "untile")).join("");
    bind(a);
    document.querySelectorAll("#pool .tile").forEach(b => b.classList.toggle("used", ans.includes(+b.dataset.k)));
    const c = document.querySelector("[data-act=check]"); if (c) c.disabled = !ans.length;
  };
  ACT.tile = el => { const k = +el.dataset.k; if (!ans.includes(k)) { ans.push(k); draw(); if (it.zhFull && tiles[k].zh) say(tiles[k].zh); } };
  ACT.untile = el => { ans.splice(+el.dataset.j, 1); draw(); };
  ACT.check = () => {
    const ok = ans.map(k => key(tiles[k])).join(" ") === cfg.answer.map(key).join(" ");
    document.querySelectorAll(".tile").forEach(b => b.disabled = true);
    answered(ok, ex, { xp: 15 });
    setFooter(`<div class="feedback ${ok ? "ok" : "bad"}">${ok ? pick(["Perfect! 🧩✅", "Helemaal goed! 🎉", "对！Duì! ✅"]) : "Net niet. Zo is het goed:"}

      <button class="btn ${ok ? "green" : "primary"}" data-act="next" style="margin-top:10px">Verder →</button>`);
    say(it.zhFull);
  };
}

function exZhNl(ex) {

  tileExercise(ex, it, {
    title: "Wat betekent dit? 🇳🇱",
    top: `<div class="card"><div class="row" style="gap:12px"><button class="speaker sm" data-act="sayit">🔊</button><div><div class="hz" style="font-size:26px">${esc(it.zhFull)}</div><div style="color:var(--red)">${esc(it.pyText)}</div></div></div></div>`,
    tiles: [...words, ...extra].map(w => ({ w })), answer: words.map(w => ({ w })) });
  ACT.sayit = () => say(it.zhFull);

}
// Vul het ontbrekende woord in
function exFill(ex) {
  const it = item(ex.id);
  const skip = new Set(["我", "你", "他", "她", "吗", "呢", "的", "了", "吧"]);
  const cand = it.parts.map((p, i) => i).filter(i => !skip.has(it.parts[i].zh));
  const gap = cand.length ? pick(cand) : 0, right = it.parts[gap];
  const opts = shuffle([right, ...tileDistractors(it, 2)]);
  shell(`<div class="prompt">Welk woord ontbreekt? 🧩</div>
    <div class="card"><div class="hz" style="font-size:26px;line-height:1.6">${it.parts.map((p, i) => i === gap ? `<span class="gap">？</span>` : esc(p.zh)).join("")}</div>
    <div class="small muted" style="margin-top:6px">${esc(it.nl)}</div></div>
    <div class="opts">${opts.map((o, i) => `<button class="opt text" data-act="fillopt" data-i="${i}"><span class="hz">${esc(o.zh)}</span><small style="font-size:13px;color:var(--red)">${esc(o.py)}</small></button>`).join("")}</div>`);
  ACT.fillopt = el => {
    const o = opts[+el.dataset.i], ok = o.zh === right.zh;
    app.querySelectorAll(".opt").forEach((b, j) => { b.disabled = true; if (opts[j].zh === right.zh) b.classList.add("ok"); });
    if (!ok) el.classList.add("bad");
    answered(ok, ex, { xp: 12 });
    setFooter(`<div class="feedback ${ok ? "ok" : "bad"}">${ok ? "Goed ingevuld! ✅" : "Het juiste woord is groen."}
      <div class="hz" style="font-size:22px;margin-top:4px">${esc(it.zhFull)}</div><div style="color:var(--red)">${esc(it.pyText)}</div></div>
      <button class="btn ${ok ? "green" : "primary"}" data-act="next" style="margin-top:10px">Verder →</button>`);
    say(it.zhFull);
  };
}
// Koppel de paartjes (Chinees ↔ Nederlands)
function exMatch(ex) {
  let ids = (ex.ids || []).slice();
  const its = ids.map(item).filter(Boolean);
  for (const x of shuffle(introducedIds().map(item))) {
    if (its.length >= 5) break;
    if (its.some(o => o.id === x.id || o.nl === x.nl || soundSim(o, x) >= SIMILAR)) continue;
    its.push(x);
  }
  if (its.length < 3) return nextEx();
  const left = shuffle(its), right = shuffle(its);
  let selL = null, selR = null, errors = new Set(), matched = 0;
  shell(`<div class="prompt">Koppel de paartjes 🔗</div>
    <div class="match"><div>${left.map((x, i) => `<button class="mt" data-act="ml" data-i="${i}"><span class="hz">${esc(x.zhFull)}</span><small>${esc(x.pyText)}</small></button>`).join("")}</div>
    <div>${right.map((x, i) => `<button class="mt nlx" data-act="mr" data-i="${i}">${esc(x.nl)}</button>`).join("")}</div></div>`);
  const tryMatch = () => {
    if (selL == null || selR == null) return;
    const a = left[selL], b = right[selR];
    const bl = app.querySelector(`[data-act=ml][data-i="${selL}"]`), br = app.querySelector(`[data-act=mr][data-i="${selR}"]`);
    if (a.id === b.id) {
      [bl, br].forEach(x => { x.classList.remove("sel"); x.classList.add("done"); x.disabled = true; });
      matched++; fx("ok");
      if (!errors.has(a.id)) srs(a.id, true);
      if (matched === its.length) {
        answered(errors.size === 0 ? true : null, ex, { xp: 15 });
        if (errors.size) { sess.ok++; }
        save();
        setFooter(`<div class="feedback ok">${errors.size ? "Alle paartjes gevonden! 🔗" : "Foutloos gekoppeld! 🔗🎉"}</div>
          <button class="btn green" data-act="next" style="margin-top:10px">Verder →</button>`);
      }
    } else {
      [bl, br].forEach(x => { x.classList.remove("sel"); x.classList.add("wrong"); setTimeout(() => x.classList.remove("wrong"), 450); });
      errors.add(a.id); errors.add(b.id); fx("bad");
      sess.combo = 0; const c = document.getElementById("combo"); if (c) c.textContent = "";
    }
    selL = selR = null;
  };
  ACT.ml = el => { app.querySelectorAll("[data-act=ml]").forEach(x => x.classList.remove("sel")); el.classList.add("sel"); selL = +el.dataset.i; say(left[selL].zhFull); tryMatch(); };
  ACT.mr = el => { app.querySelectorAll("[data-act=mr]").forEach(x => x.classList.remove("sel")); el.classList.add("sel"); selR = +el.dataset.i; tryMatch(); };
}

/* ---------- gesprek ---------- */
function whoA(u) { const w = u.who || { name: "Wang Ming", e: "🧑" }; return w.e + " " + w.name; }
function exDialogue(ex) {
  const u = UNITS[ex.unit];
  const lines = u.dialogue.map(lineDerived);
  let playing = false;
  const bubbles = () => lines.map((l, i) => `<div class="bubble ${l.s}" data-act="line" data-i="${i}" id="b${i}">
      <div class="who">${l.s === "A" ? esc(whoA(u)) : "🙋‍♂️ Jij"}</div><div class="h hz">${esc(l.zhFull)}</div><div class="p">${esc(l.pyText)}</div>
      <div class="n hidden">${esc(l.nl)}</div></div>`).join("");
  shell(`<div class="prompt">💬 Gesprek: ${esc(u.title)}</div><div class="small muted">Luister eerst. Tik op een zin om hem opnieuw te horen en de betekenis te zien.</div>
    <div style="margin-top:10px">${bubbles()}</div>`,
    { footer: `<button class="btn" data-act="playall">▶️ Speel het gesprek af</button>
      <button class="btn primary" data-act="roleplay" style="margin-top:10px">${quiet ? "Klaar →" : "🎤 Nu jij: speel de rol van 'Jij'"}</button>` });
  const playLine = async i => { app.querySelectorAll(".bubble").forEach(b => b.classList.remove("playing")); const b = document.getElementById("b" + i); if (b) { b.classList.add("playing"); b.scrollIntoView({ block: "nearest", behavior: "smooth" }); } await say(lines[i].zhFull, { pitch: lines[i].s === "A" ? 1.15 : 0.85 }); if (b) b.classList.remove("playing"); };
  ACT.line = el => { const i = +el.dataset.i; el.querySelector(".n").classList.remove("hidden"); playLine(i); };
  ACT.playall = async () => { if (playing) return; playing = true; for (let i = 0; i < lines.length; i++) { if (!sess || sess.queue[sess.idx] !== ex) break; await playLine(i); await new Promise(r => setTimeout(r, 350)); } playing = false; };
  ACT.roleplay = () => { stopSay(); if (quiet) return finishDialogue(ex); rolePlay(ex, lines, 0); };
}
function rolePlay(ex, lines, i) {
  if (i >= lines.length) return finishDialogue(ex);
  const l = lines[i];
  if (l.s === "A") {
    shell(`<div class="prompt">🎭 Rollenspel (${i + 1}/${lines.length})</div>
      <div class="bubble A playing"><div class="who">${esc(whoA(UNITS[ex.unit]))}</div><div class="h hz">${esc(l.zhFull)}</div><div class="p">${esc(l.pyText)}</div><div class="n">${esc(l.nl)}</div></div>`,
      { footer: `<button class="btn" data-act="again">🔊 Nog eens</button><button class="btn primary" data-act="rp" style="margin-top:10px">Jouw beurt →</button>` });
    ACT.again = () => say(l.zhFull, { pitch: 1.15 });
    ACT.rp = () => rolePlay(ex, lines, i + 1);
    say(l.zhFull, { pitch: 1.15 });
  } else {
    shell(`<div class="prompt">🎭 Jouw beurt (${i + 1}/${lines.length})</div>
      <div class="bubble B"><div class="who">🙋‍♂️ Jij zegt:</div><div class="h hz">${esc(l.zhFull)}</div><div class="p">${esc(l.pyText)}</div><div class="n">${esc(l.nl)}</div></div>
      <div id="sw"></div>`,
      { footer: `<button class="btn ghost" data-act="rp">Sla over →</button>` });
    ACT.rp = () => rolePlay(ex, lines, i + 1);
    speakWidget(document.getElementById("sw"), l, (score, best) => {
      setFooter(`<button class="btn ${best >= 65 ? "green" : "primary"}" data-act="rp">Verder →</button>`);
    });
  }
}
function finishDialogue(ex) {
  const u = UNITS[ex.unit];
  unitState(u).dialogue = true;
  answered(true, ex, { xp: 30 });
  afterUnitPart(ex);
}
function afterUnitPart(ex) {
  const u = UNITS[ex.unit];
  const justDone = !ex.replay && checkUnitDone(u);
  save();
  if (!justDone) return nextEx();
  const n = unitsDone(), a = ageAfter(n), aOld = ageAfter(n - 1), sNew = stage(a), sOld = stage(aOld);
  const older = ageLabel(a) !== ageLabel(aOld);
  fx("win"); confetti(60);
  shell(`<div class="celebrate"><div class="huge">${sNew.e}</div>
    <h1>${older ? "Je bent nu " + ageLabel(a) + "!" : "Wereld voltooid!"}</h1>
    ${sNew.name !== sOld.name ? `<p style="font-size:18px">🎉 Je bent opgegroeid van <b>${sOld.name}</b> naar <b>${sNew.name}</b>!</p>` : `<p style="font-size:17px">"${esc(u.title)}" ✅</p>`}
    ${UNITS[ex.unit + 1] ? `<p class="muted">Volgende wereld: ${UNITS[ex.unit + 1].emoji} ${esc(UNITS[ex.unit + 1].title)}</p>` : `<p>🏆 Alle werelden voltooid! Je kunt nu echt een gesprek voeren.</p>`}</div>`,
    { footer: `<button class="btn primary" data-act="next">Verder →</button>` });
}

function storyQuestion(ex, k) {

}
